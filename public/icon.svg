<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Blue to Vibrant Purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Radial Glow behind the book and sparkles -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#A5B4FC" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <!-- Left Page Highlight Gradient -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Right Page Highlight Gradient -->
    <linearGradient id="rightPageGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Page Layers Gradient for Realistic Stack -->
    <linearGradient id="leftStackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="rightStackGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- AI Sparkle Shimmer Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="cyanSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#090d16" flood-opacity="0.32" />
    </filter>

    <!-- Sparkle Glow Filter -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Full-bleed Background for Android Adaptive Icon Safe Zone -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- 2. Soft Luminous Center Aura -->
  <circle cx="256" cy="250" r="180" fill="url(#glowGrad)" />

  <!-- 3. Stylized Open Book Symbol (Strictly centered inside 340px Safe Zone) -->
  <g filter="url(#bookShadow)">
    <!-- Base Page Stack (Gives 3D depth and thickness) -->
    <!-- Left Stack Bottom -->
    <path d="M 256 348 C 212 328, 140 334, 114 360 C 118 368, 212 344, 256 362 Z" fill="url(#leftStackGrad)" opacity="0.6" />
    <!-- Right Stack Bottom -->
    <path d="M 256 348 C 300 328, 372 334, 398 360 C 394 368, 300 344, 256 362 Z" fill="url(#rightStackGrad)" opacity="0.6" />

    <!-- Center Spine Binding Base -->
    <path d="M 248 350 Q 256 362 264 350 L 264 364 Q 256 376 248 364 Z" fill="#4F46E5" />

    <!-- Left Main Page -->
    <path d="M 256 340 C 205 304, 138 312, 112 336 C 112 262, 112 254, 112 248 C 146 220, 215 216, 256 250 Z" fill="url(#leftPageGrad)" />

    <!-- Right Main Page -->
    <path d="M 256 340 C 307 304, 374 312, 400 336 C 400 262, 400 254, 400 248 C 366 220, 297 216, 256 250 Z" fill="url(#rightPageGrad)" />

    <!-- Center Spine Seam Divider -->
    <path d="M 254 250 L 254 342 C 255.3 343 256.7 343 258 342 L 258 250 Z" fill="#CBD5E1" />

    <!-- Left Page Embossed Content Lines -->
    <path d="M 148 262 C 178 248, 218 250, 238 270" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 148 284 C 178 270, 218 272, 238 292" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 148 306 C 178 292, 218 294, 238 314" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Right Page Embossed Content Lines -->
    <path d="M 364 262 C 334 248, 294 250, 274 270" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 364 284 C 334 270, 294 272, 274 292" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 364 306 C 334 292, 294 294, 274 314" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>

  <!-- 4. Subtle Rising Intelligence Rays from Book Spine -->
  <g opacity="0.7">
    <path d="M 256 244 Q 256 198 256 160" stroke="url(#cyanSparkleGrad)" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round" />
    <path d="M 238 244 Q 228 198 198 172" stroke="url(#sparkleGrad)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" opacity="0.6" />
    <path d="M 274 244 Q 284 198 314 168" stroke="url(#sparkleGrad)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 5. AI Sparkles Emerging from the Open Book -->
  <!-- Primary Luminous 4-Point AI Star (Centered above book) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 256 122 Q 256 168 290 168 Q 256 168 256 214 Q 256 168 222 168 Q 256 168 256 122 Z" fill="#FFFFFF" />
    <circle cx="256" cy="168" r="5.5" fill="url(#sparkleGrad)" />
  </g>

  <!-- Secondary AI Sparkle (Top-Right) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 326 128 Q 326 150 342 150 Q 326 150 326 172 Q 326 150 310 150 Q 326 150 326 128 Z" fill="#FFFFFF" />
    <circle cx="326" cy="150" r="3.5" fill="url(#cyanSparkleGrad)" />
  </g>

  <!-- Tertiary AI Sparkle (Top-Left) -->
  <g filter="url(#sparkleGlow)">
    <path d="M 186 156 Q 186 174 198 174 Q 186 174 186 192 Q 186 174 174 174 Q 186 174 186 156 Z" fill="#FFFFFF" />
    <circle cx="186" cy="174" r="2.8" fill="url(#sparkleGrad)" />
  </g>

  <!-- Micro AI Light Particles -->
  <circle cx="224" cy="136" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="288" cy="126" r="2.5" fill="#38BDF8" opacity="0.85" />
  <circle cx="352" cy="184" r="3" fill="#FDE047" opacity="0.85" />
  <circle cx="160" cy="210" r="2.5" fill="#FFFFFF" opacity="0.75" />
</svg>